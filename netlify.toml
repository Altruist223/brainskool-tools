[build]
  functions = "netlify/functions"
  publish   = "."

[functions]
  node_bundler = "esbuild"
  timeout = 26

# Rewrite all /api/* requests to the serverless function
[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/api/:splat"
  status = 200

# SPA-style fallback — serve index.html for any unmatched route
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
