<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Brainskool Tools</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="shared.css">
    <style>
        body { background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%); min-height: 100vh; display: flex; flex-direction: column; margin: 0; }
        .auth-container { flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem; animation: fadeIn 0.6s ease-out; }
        .auth-card { background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); padding: 3rem; border-radius: 24px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.1); width: 100%; max-width: 400px; border: 1px solid rgba(255,255,255,0.2); text-align: center; }
        .auth-card h1 { color: #0f172a; font-size: 2rem; font-weight: 800; margin-bottom: 0.5rem; }
        .auth-card p { color: #64748b; margin-bottom: 2rem; }
        .form-group { margin-bottom: 1.5rem; text-align: left; }
        .form-group label { display: block; margin-bottom: 0.5rem; color: #475569; font-weight: 500; font-size: 0.95rem; }
        .form-group input { width: 100%; padding: 0.75rem 1rem; border: 2px solid #e2e8f0; border-radius: 12px; font-size: 1rem; font-family: inherit; transition: all 0.3s ease; box-sizing: border-box; background: #f8fafc; }
        .form-group input:focus { outline: none; border-color: #3b82f6; background: white; box-shadow: 0 0 0 4px rgba(59,130,246,0.1); }
        .btn-primary { width: 100%; padding: 1rem; background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); color: white; border: none; border-radius: 12px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.3s ease; margin-top: 1rem; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 20px -10px rgba(37,99,235,0.5); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .auth-links { margin-top: 2rem; font-size: 0.95rem; color: #64748b; }
        .auth-links a { color: #2563eb; text-decoration: none; font-weight: 600; }
        .error-msg { color: #ef4444; background: #fee2e2; padding: 0.75rem; border-radius: 8px; margin-bottom: 1rem; font-size: 0.9rem; display: none; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <nav class="bs-navbar-wrapper">
        <div class="bs-header">
            <a href="/" class="bs-logo">
                <img src="https://brainskool.in/wp-content/uploads/2022/11/bs-logo-e1669098799830-2048x503-1.png" alt="BrainSkool India">
            </a>
            <div class="bs-nav">
                <a href="/">Home</a>
                <a href="/login.html">Login</a>
            </div>
        </div>
    </nav>

    <div class="auth-container">
        <div class="auth-card">
            <h1>Welcome Back</h1>
            <p>Enter your credentials to access your account.</p>
            <div id="errorMsg" class="error-msg"></div>
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" required placeholder="Enter your username">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="Enter your password">
                </div>
                <button type="submit" class="btn-primary" id="submitBtn">Sign In</button>
            </form>
            <div class="auth-links" style="font-size:0.85rem; color:#94a3b8;">
                Contact your administrator to get an account.
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script>
        const API_BASE = 'https://brainskooltools.netlify.app';

        firebase.initializeApp({
            apiKey: "AIzaSyAfyEmuXFm81a3Vu9qDuz5A2mYRiOonQvY",
            authDomain: "brainskool-tools-app.firebaseapp.com",
            projectId: "brainskool-tools-app",
            appId: "1:1027616261885:web:7ac7f9e7f55c7fcbd46094"
        });
        const fbAuth = firebase.auth();

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn      = document.getElementById('submitBtn');
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.style.display = 'none';
            btn.disabled = true;
            btn.textContent = 'Signing in…';

            const username = document.getElementById('username').value.trim().toLowerCase();
            const password = document.getElementById('password').value;
            const email    = `${username}@brainskooltools.app`;

            try {
                const cred  = await fbAuth.signInWithEmailAndPassword(email, password);
                const token = await cred.user.getIdToken(true);

                const res  = await fetch(`${API_BASE}/api/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` }
                });
                const data = await res.json();

                if (res.ok) {
                    localStorage.setItem('fbUser', JSON.stringify(data.user));
                    localStorage.setItem('fbToken', token);
                    window.location.href = data.user.role === 'admin' ? '/admin.html' : '/';
                } else {
                    errorMsg.textContent = data.error || 'Login failed';
                    errorMsg.style.display = 'block';
                    await fbAuth.signOut();
                }
            } catch (err) {
                if (err.code === 'auth/invalid-credential' || err.code === 'auth/wrong-password' || err.code === 'auth/user-not-found') {
                    errorMsg.textContent = 'Invalid username or password.';
                } else {
                    errorMsg.textContent = err.message || 'Login failed. Please try again.';
                }
                errorMsg.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Sign In';
            }
        });
    </script>
</body>
</html>
